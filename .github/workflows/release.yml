name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked GPU and build dependencies
        run: uv sync --locked --no-dev --no-group cpu --extra gpu --group build

      - name: Build executable
        run: uv run --locked --no-dev --no-group cpu --extra gpu --group build pyinstaller forge.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows
          path: dist/Cadence.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cadence.exe
