name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'minimal' || 'offscreen' }}
      QT_API: pyqt6
      CADENCE_QT_API: pyqt6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install complete locked environment
        run: uv sync --locked

      - name: Check runtime imports
        run: uv run python -c "import torch, torchaudio, whisperx, onnxruntime, supertonic; from whisperx.asr import load_model; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__); print('ONNX providers', onnxruntime.get_available_providers())"

      - name: Run lint
        run: uv run ruff check .

      - name: Run type check
        run: uv run mypy --config-file mypy.ini system/runtime_settings.py

      - name: Run tests
        run: uv run pytest -q tests/unit tests/service tests/integration tests/ui
