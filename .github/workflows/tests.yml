name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
      CADENCE_QT_API: pyqt6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            PyQt6==6.6.1 \
            PyQt6-Qt6==6.6.3 \
            "numpy<2.0" \
            soundfile \
            tqdm \
            supertonic==1.3.1 onnxruntime==1.24.1 \
            ruff \
            mypy \
            pytest \
            pytest-mock \
            pytest-qt

      - name: Run lint
        run: python -m ruff check .

      - name: Run type check
        run: python -m mypy --config-file mypy.ini system/runtime_settings.py

      - name: Run tests
        run: python -m pytest -q tests/unit tests/service tests/integration tests/ui

  tests-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: minimal
      QT_API: pyqt6
      CADENCE_QT_API: pyqt6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.6.1 PyQt6-Qt6==6.6.3 "numpy<2.0" soundfile tqdm supertonic==1.3.1 onnxruntime==1.24.1 ruff mypy pytest pytest-mock pytest-qt

      - name: Check native runtime imports
        shell: python
        run: |
          import platform
          import subprocess
          import sys
          print(platform.platform(), platform.processor(), flush=True)
          for code in (
              "import onnxruntime; print(onnxruntime.__version__, onnxruntime.get_available_providers())",
              "from PyQt6 import QtCore, QtWidgets; import onnxruntime; print('Qt then ONNX OK')",
              "import onnxruntime; from PyQt6 import QtCore, QtWidgets; print('ONNX then Qt OK')",
          ):
              print(code, flush=True)
              result = subprocess.run([sys.executable, "-X", "faulthandler", "-c", code])
              print("exit code:", result.returncode, flush=True)

      - name: Run lint
        run: python -m ruff check .

      - name: Run type check
        run: python -m mypy --config-file mypy.ini system/runtime_settings.py

      - name: Run tests
        run: python -m pytest -q tests/unit tests/service tests/integration tests/ui
